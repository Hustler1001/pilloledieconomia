name: fb-poster
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
concurrency:
  group: fb-poster
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Pubblica su Facebook
        working-directory: fb-poster
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python app.py
      - name: Salva lo stato
        run: |
          git config user.name "fb-poster"
          git config user.email "fb-poster@users.noreply.github.com"
          git add fb-poster/state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "stato fb-poster [skip ci]"
            for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && break || sleep 5; done
          fi
